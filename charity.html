<script>
const themeBtn=document.getElementById('themeBtn');
if(localStorage.getItem('stella-theme')==='light')document.body.classList.add('light');
themeBtn.addEventListener('click',()=>{document.body.classList.toggle('light');localStorage.setItem('stella-theme',document.body.classList.contains('light')?'light':'dark')});
