<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP — STELLA</title>
<link rel="stylesheet" href="styles.css">
<style>
.vip-soon-page{min-height:100vh;display:grid;place-items:center;padding:32px;background:var(--STELLA-bg,#0b0f13);color:inherit}
.vip-soon-card{width:min(620px,92vw);padding:48px 28px;text-align:center;border:1px solid rgba(120,148,173,.4);border-radius:24px;background:rgba(255,255,255,.035);box-shadow:0 20px 70px rgba(0,0,0,.25)}
.vip-soon-badge{display:inline-flex;padding:8px 16px;border:1px solid rgba(120,148,173,.55);border-radius:999px;color:var(--STELLA-blue);font-weight:900;letter-spacing:1.5px}
.vip-soon-card h1{margin:22px 0 8px;font-size:34px}
.vip-soon-card p{margin:0;color:#9ca9b2;font-size:14px}
</style>
</head>
<body>
<main class="vip-soon-page">
<section class="vip-soon-card">
<span class="vip-soon-badge">VIP</span>
<h1>قريبــاً — Soon</h1>
<p>مساحة VIP قيد التطوير.</p>
</section>
</main>
</body>
</html>
